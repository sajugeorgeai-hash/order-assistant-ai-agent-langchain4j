spring:
  application:
    name: saj-ai-demo
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:saj
    username: sa
    password:
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    defer-datasource-initialization: true
  h2:
    console:
      enabled: true
      path: /h2-console

server.port: 9292

langchain4j:
  ollama:
    chat-model:
      base-url: http://localhost:11434
      model-name: qwen2.5:3b
      log-requests: true
      log-responses: true
